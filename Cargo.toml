[package]
name = "spore"
version = "0.2.0"
edition = "2021"
description = "Minimal coding agent: one tool (bash)."
license = "MIT"

[[bin]]
name = "spore"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
opt-level = "z"
